# Praxis listener for the HR demo — IBM Verify + Cedar variant.
#
# Identical to praxis-verify-opa.yaml except the policy filter loads
# policy-verify-cedar.yaml (Cedar PDP) instead of policy-verify-opa.yaml
# (OPA/Rego PDP). Both exchange tokens at IBM Verify rather than Keycloak.
# Run with:
#
#   USE_VERIFY=true GATEWAY_CONFIG=praxis-verify-cedar.yaml ./restart.sh
#
# Both switches are needed and they cover different halves of the path:
#   GATEWAY_CONFIG  — which IdP the *gateway* validates and exchanges against
#   USE_VERIFY      — which IdP the *scenario scripts* mint from (scenarios/_lib.sh)
#
# Mismatch them and the failure is legible rather than silent: minting from
# Keycloak while the gateway trusts only Verify yields auth.untrusted_issuer.
#
# The policy document is GENERATED from policy-verify-cedar.yaml.tmpl by
# render-verify-config.sh, which restart.sh calls automatically. Editing
# policy-verify-cedar.yaml directly is silently undone on the next run.

listeners:
  - name: gateway
    address: "127.0.0.1:8090"
    protocol: http
    filter_chains:
      - main

filter_chains:
  - name: main
    filters:
      - filter: mcp
        # Defaults are fine. Reads body, writes mcp.method / mcp.name
        # into ctx.filter_metadata.

      - filter: policy
        config_path: ./policy-verify-cedar.yaml
        # Verify is public HTTPS, so the IdP side needs no loopback opt-in.
        # Kept true for two localhost holdovers in policy-verify-cedar.yaml: the
        # CIBA plugin (manager-approver) still points at Keycloak, and the
        # Keycloak issuer is still trusted alongside Verify. Drop this once
        # both move to Verify.
        allow_private_idp: true
        body_access: read_write

      - filter: router
        routes:
          - path_prefix: "/"
            cluster: hr-mcp-backend

      - filter: load_balancer
        clusters:
          - name: hr-mcp-backend
            endpoints:
              # Host-bound port of the docker-compose `hr-mcp` service.
              - "127.0.0.1:9100"

# The mock HR MCP server (:9100) and Valkey (:6379) are still local even on the
# Verify path — only identity and delegation move off-box. Praxis refuses a
# private or loopback endpoint unless a config says so out loud.
insecure_options:
  allow_private_endpoints: true # demo proxies to local backends
